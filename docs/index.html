<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Techniciens – Service technique</title>
<meta name="description" content="Interventions du service technique : liste, prise en charge et clôture.">
<meta name="theme-color" content="#b5542a">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    color-scheme: light;
    --fond: #fbf6ee; --carte: #ffffff; --doux2: #fffdf9; --texte: #2b2a28; --doux: #6b665e; --bord: #e6ddd0;
    --accent: #b5542a; --accent-fonce: #9a4220; --accent-clair: #fbe9e0;
    --panne: #ef4444; --panne-f: #b91c1c; --panne-c: #fef2f2;
    --cafe: #a855f7; --cafe-f: #7e22ce; --cafe-c: #faf5ff;
    --entretien: #3b82f6; --entretien-f: #1d4ed8; --entretien-c: #eff6ff;
    --livraison: #22c55e; --livraison-f: #15803d; --livraison-c: #f0fdf4;
    --horeca: #f59e0b; --horeca-f: #b45309; --horeca-c: #fffbeb;
    --rappel: #e60000; --rappel-f: #d00000; --rappel-c: #fff0f0;
    --attente-f: #7a4b00; --attente-c: #fff4d6; --attente-b: #e8c56a;
    --cours: #166534; --cours-c: #e8f5ec; --cours-b: #86c99a;
    --reserve: #0e7490;
    --rayon: 16px; --ombre: 0 1px 3px rgba(43,42,40,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texte); font-size: 16px; -webkit-tap-highlight-color: transparent;
    display: flex; flex-direction: column; min-height: 100%;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .cache { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- En-tête ---------- */
  header {
    background: var(--fond); padding: 16px 16px 10px; padding-top: calc(16px + env(safe-area-inset-top));
    display: flex; flex-direction: column; gap: 12px; position: sticky; top: 0; z-index: 10;
  }
  .titre-ligne { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .titre-ligne h1 { font-size: 1.7rem; margin: 0; font-weight: 800; letter-spacing: -.02em; }
  .titre-ligne .sous { font-size: .82rem; color: var(--doux); margin-top: 2px; }
  .btn-compte {
    display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; border-radius: 22px;
    border: 1px solid var(--bord); background: var(--carte); font-size: .88rem; font-weight: 700; flex: none;
  }
  .btn-actu { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--bord); background: var(--carte);
    color: var(--doux); display: flex; align-items: center; justify-content: center; flex: none; }
  .btn-actu svg { width: 21px; height: 21px; }
  .btn-actu.occupe svg { animation: t .8s linear infinite; }
  .pastille {
    width: 32px; height: 32px; border-radius: 16px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: .82rem; font-weight: 800; flex: none;
  }

  /* ---------- Compteurs par type ---------- */
  .compteurs { display: flex; gap: 6px; }
  .compteurs button {
    flex: 1; min-width: 0; height: 48px; border-radius: 14px; border: 1.5px solid var(--bord);
    background: var(--carte); display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0;
  }
  .compteurs svg { width: 20px; height: 20px; flex: none; }
  .compteurs b { font-size: 1.25rem; font-weight: 800; color: var(--texte); }
  .compteurs button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px currentColor; }

  /* ---------- Filtres ---------- */
  .filtres { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filtres::-webkit-scrollbar { display: none; }
  .filtres button {
    height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--bord);
    background: var(--carte); font-size: .88rem; font-weight: 600; white-space: nowrap; flex: none;
  }
  .filtres button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

  /* ---------- Liste ---------- */
  main { flex: 1; padding: 0 16px calc(104px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
  .carte {
    background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon);
    overflow: hidden; box-shadow: var(--ombre); width: 100%; padding: 0; text-align: left; display: block;
  }
  .liseret { height: 3px; }
  .carte-corps { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .carte-haut { display: flex; align-items: center; gap: 12px; }
  .tuile {
    width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .tuile svg { width: 24px; height: 24px; }
  .carte-titres { flex: 1; min-width: 0; }
  .carte-titres .nom { font-size: 1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carte-titres .sous { font-size: .82rem; color: var(--doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .etiq { padding: 6px 10px; border-radius: 10px; font-size: .75rem; font-weight: 700; white-space: nowrap; flex: none; }
  .etiq-attente { background: var(--attente-c); border: 1px solid var(--attente-b); color: var(--attente-f); }
  .etiq-cours { background: var(--cours-c); border: 1px solid var(--cours-b); color: var(--cours); }
  .etiq-reserve { background: var(--reserve); color: #fff; }
  .nature { font-size: .88rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nature.rappel { font-weight: 800; color: var(--rappel-f); }
  .info-liv { font-size: .8rem; font-weight: 700; color: var(--horeca-f); }

  /* ---------- Pied de page ---------- */
  footer {
    height: 76px; flex: none; background: var(--carte); border-top: 1px solid var(--bord);
    display: flex; align-items: center; justify-content: space-around; padding: 0 8px;
    padding-bottom: env(safe-area-inset-bottom); height: calc(76px + env(safe-area-inset-bottom));
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  }
  footer button { width: 80px; height: 56px; border: 0; background: transparent; color: var(--doux);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: .75rem; font-weight: 600; }
  footer button[aria-current="page"] { color: var(--accent); font-weight: 700; }
  footer svg { width: 24px; height: 24px; }
  .btn-plus {
    width: 64px; height: 64px; border-radius: 32px; border: 0; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(181,84,42,.35); flex: none;
  }
  .btn-plus svg { width: 28px; height: 28px; }

  /* ---------- Écrans pleine page ---------- */
  .page { flex: 1; display: flex; flex-direction: column; }
  .barre-haut { padding: 16px 12px 4px; padding-top: calc(16px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 4px; }
  .btn-retour { width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; flex: none; }
  .btn-retour svg { width: 24px; height: 24px; }
  .barre-haut h2 { font-size: 1.35rem; margin: 0; font-weight: 800; letter-spacing: -.01em; flex: 1; }
  .contenu { flex: 1; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .bloc { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .bloc .lib { font-size: .8rem; font-weight: 700; color: var(--doux); }
  .bloc .val { font-size: 1rem; line-height: 1.45; }
  .actions { flex: none; padding: 14px 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--carte); border-top: 1px solid var(--bord); display: flex; flex-direction: column; gap: 10px; position: sticky; bottom: 0; }
  .btn { height: 56px; border-radius: 14px; border: 0; font-size: 1.05rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
  .btn svg { width: 22px; height: 22px; }
  .btn-principal { background: var(--accent); color: #fff; }
  .btn-prendre { background: var(--cours); color: #fff; }
  .btn-reserver { background: var(--reserve); color: #fff; height: 52px; font-size: .95rem; }
  .btn-rouge { background: var(--panne-c); border: 1.5px solid #fca5a5; color: var(--panne-f); height: 52px; font-size: .95rem; }
  .btn-second { background: var(--carte); border: 1.5px solid var(--accent); color: var(--accent); height: 52px; font-size: .95rem; }
  .btn:disabled { opacity: .5; }
  .deux { display: flex; gap: 10px; }
  .deux .btn { flex: 1; }

  /* ---------- Connexion ---------- */
  .connexion { flex: 1; display: flex; flex-direction: column; padding: 0 16px; }
  .logo-rond {
    width: 84px; height: 84px; border-radius: 26px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(181,84,42,.3);
  }
  .logo-rond svg { width: 46px; height: 46px; }
  .champ { display: flex; flex-direction: column; gap: 6px; }
  .champ label { font-size: .8rem; font-weight: 700; color: var(--doux); }
  .champ input, .champ textarea, .champ select {
    width: 100%; height: 52px; border-radius: 14px; border: 1px solid var(--bord);
    background: var(--doux2); padding: 0 14px; font-size: 1.05rem;
  }
  .champ textarea { height: auto; padding: 12px 14px; line-height: 1.45; resize: vertical; }
  .case { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: .95rem; font-weight: 600; cursor: pointer; }
  .case input { width: 24px; height: 24px; margin: 0; accent-color: var(--accent); }

  /* ---------- Messages ---------- */
  .msg { border-radius: 12px; padding: 12px 14px; font-size: .9rem; font-weight: 600; line-height: 1.45; }
  .msg-err { background: var(--panne-c); border: 1px solid #fca5a5; color: var(--panne-f); }
  .msg-ok { background: var(--cours-c); border: 1px solid var(--cours-b); color: var(--cours); }
  .msg-info { background: var(--attente-c); border: 1px solid var(--attente-b); color: var(--attente-f); }
  .vide { text-align: center; color: var(--doux); padding: 40px 20px; line-height: 1.5; }

  /* ---------- Retour visuel au toucher ---------- */
  button, .carte, .ligne-tech, a.bloc { transition: transform .08s ease, background-color .12s ease, filter .08s ease; }
  button:active, .carte:active, .ligne-tech:active, a.bloc:active { transform: scale(.97); filter: brightness(.94); }
  footer button:active { background: var(--accent-clair); border-radius: 14px; color: var(--accent-fonce); }
  .btn-plus:active { transform: scale(.92); box-shadow: 0 2px 8px rgba(181,84,42,.45); }
  .btn-plus.occupe svg { animation: t .8s linear infinite; }
  .compteurs button:active, .filtres button:active { transform: scale(.94); }

  /* ---------- Chargement ---------- */
  .chargement { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 30px; color: var(--doux); }
  .tourne { width: 22px; height: 22px; border: 3px solid var(--bord); border-top-color: var(--accent); border-radius: 50%; animation: t 1s linear infinite; }
  @keyframes t { to { transform: rotate(360deg); } }

  /* ---------- Liste des techniciens (administrateur) ---------- */
  .ligne-tech { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon);
    padding: 0 16px; min-height: 64px; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .ligne-tech.ouvert { border: 2px solid var(--accent); flex-direction: column; align-items: stretch; padding-bottom: 16px; }
  .rond { width: 40px; height: 40px; border-radius: 20px; background: var(--bord); color: var(--doux);
    display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
  .rond.moi { background: var(--accent); color: #fff; }
  .badge { padding: 4px 10px; border-radius: 10px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
  .badge-actif { background: var(--cours-c); color: var(--cours); }
  .badge-prov { background: var(--attente-c); border: 1px solid var(--attente-b); color: var(--attente-f); }
  .badge-off { background: var(--bord); color: var(--doux); }
  .badge-admin { background: var(--accent-clair); color: var(--accent-fonce); }
  .petits { display: flex; gap: 8px; }
  .petits button { flex: 1; height: 48px; border-radius: 12px; font-size: .85rem; font-weight: 700; border: 1px solid var(--bord); background: var(--carte); }
  .petits .pr { background: var(--accent); border-color: var(--accent); color: #fff; }
  .petits .sec { border: 1.5px solid var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=3" defer></script>
</body>
</html>
